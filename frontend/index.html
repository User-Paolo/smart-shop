<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Shop</title>
  <meta name="description" content="Smart E-Commerce storefront">
  <link rel="stylesheet" href="/css/styles.css">
  <script type="module" src="/js/shop.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to products</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" aria-label="Smart Shop home">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span class="brand-name">Smart Shop</span>
      </a>

      <form id="search-form" class="search" role="search">
        <label class="sr-only" for="search">Search products</label>
        <input id="search" type="search" placeholder="Search products, SKUs…" maxlength="100" autocomplete="off">
      </form>

      <nav id="user-nav" class="user-nav" aria-label="Account"></nav>

      <button id="cart-open" class="cart-btn" type="button" aria-label="Open cart">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <span>Cart</span>
        <span id="cart-count" class="cart-count" hidden>0</span>
      </button>
    </div>
  </header>

  <div class="shop-layout">
    <aside class="filters-panel" aria-label="Filters">
      <form id="filters" class="filters">
        <h2 class="filters-title">Filter</h2>

        <div class="field">
          <label for="filter-category">Category</label>
          <select id="filter-category" name="category"></select>
        </div>

        <fieldset class="field price-range">
          <legend>Price (€)</legend>
          <input name="min_price" type="text" inputmode="decimal" placeholder="Min" aria-label="Minimum price">
          <span aria-hidden="true">to</span>
          <input name="max_price" type="text" inputmode="decimal" placeholder="Max" aria-label="Maximum price">
        </fieldset>

        <div class="field">
          <label for="filter-sort">Sort by</label>
          <select id="filter-sort" name="sort">
            <option value="name">Name</option>
            <option value="price_asc">Price: low to high</option>
            <option value="price_desc">Price: high to low</option>
            <option value="newest">Newest</option>
          </select>
        </div>

        <label class="check">
          <input type="checkbox" name="in_stock"> In stock only
        </label>

        <button id="filters-reset" class="btn btn-ghost btn-sm" type="button">Clear filters</button>
      </form>
    </aside>

    <main id="main" class="catalogue">
      <div class="catalogue-head">
        <h1>Products</h1>
        <p id="result-count" class="muted" aria-live="polite"></p>
      </div>
      <div id="product-grid" class="product-grid" aria-busy="true"></div>
      <nav id="pager" class="pager" aria-label="Pagination"></nav>
    </main>
  </div>

  <aside id="cart-drawer" class="drawer" hidden aria-label="Shopping cart">
    <div class="drawer-panel">
      <header class="drawer-head">
        <h2>Your cart</h2>
        <button id="cart-close" class="icon-btn" type="button" aria-label="Close cart">✕</button>
      </header>
      <div id="cart-body" class="drawer-body"></div>
      <footer id="cart-footer" class="drawer-foot"></footer>
    </div>
  </aside>

  <footer class="site-foot">
    <p class="muted small">Smart E-Commerce &amp; Inventory Forecasting System · Advanced Web Information Systems</p>
  </footer>
</body>
</html>
